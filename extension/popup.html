<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <h1>Basic Auth</h1>
  <p id="private-warning" class="warning" hidden>
    Not allowed in private windows. Enable "Run in Private Windows" in about:addons.
  </p>

  <form id="setup-form" hidden>
    <p>Choose a passphrase to encrypt saved credentials.
      You'll enter it once each time Firefox starts.</p>
    <p id="legacy-note" class="note" hidden></p>
    <label>Passphrase <input id="setup-pass" type="password" required></label>
    <label>Confirm <input id="setup-confirm" type="password" required></label>
    <div class="row"><button type="submit">Encrypt &amp; unlock</button></div>
  </form>

  <form id="unlock-form" hidden>
    <label>Passphrase <input id="unlock-pass" type="password" required></label>
    <div class="row"><button type="submit">Unlock</button></div>
  </form>

  <form id="form" hidden>
    <label>Host or pattern
      <span class="input-row">
        <input id="host" placeholder="*.example.com" required>
        <button type="button" id="use-current" title="Use the current tab's host">Current host</button>
      </span>
    </label>
    <label>Username <input id="username" autocomplete="off" required></label>
    <label>Password <input id="password" type="password" autocomplete="off"></label>
    <div class="row">
      <button type="submit">Save</button>
      <button type="button" id="delete">Forget</button>
      <button type="button" id="lock">Lock</button>
    </div>
  </form>

  <p id="status"></p>
  <p><a href="#" id="manage">Manage all…</a></p>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
