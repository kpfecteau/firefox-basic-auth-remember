<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- The site in the active tab and what the extension will do there.
       data-state drives the dot: answer | none | locked | new | idle. -->
  <header class="band site" id="site" data-state="idle">
    <svg class="band-key" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="7.5" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M12 12h10M18 12v3.5M21 12v2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <div class="band-text">
      <p class="site-host" id="site-host">No website in this tab</p>
      <p class="band-state"><span class="dot" aria-hidden="true"></span><span id="site-state"></span></p>
    </div>
  </header>

  <p id="private-warning" class="warning" hidden>
    Private windows still ask for logins. Allow “Run in Private Windows” for
    this extension in about:addons.
  </p>

  <main>
    <form id="setup-form" hidden>
      <h1>Choose a passphrase</h1>
      <p class="hint">It encrypts your saved logins. You’ll enter it once each time Firefox starts.</p>
      <p id="legacy-note" class="hint" hidden></p>
      <label for="setup-pass">Passphrase</label>
      <input id="setup-pass" type="password" required>
      <label for="setup-confirm">Confirm passphrase</label>
      <input id="setup-confirm" type="password" required>
      <div class="actions"><button type="submit" class="primary">Encrypt and unlock</button></div>
    </form>

    <form id="unlock-form" hidden>
      <label for="unlock-pass">Passphrase</label>
      <input id="unlock-pass" type="password" required>
      <div class="actions"><button type="submit" class="primary">Unlock</button></div>
    </form>

    <form id="form" hidden>
      <label for="host">Host or pattern</label>
      <div class="input-row">
        <input id="host" class="literal" placeholder="*.example.com" spellcheck="false" required>
        <button type="button" id="use-current" class="quiet" title="Fill in the host of the site in this tab">This site</button>
      </div>
      <label for="username">Username</label>
      <input id="username" class="literal" autocomplete="off" spellcheck="false" required>
      <label for="password">Password</label>
      <!-- Deliberately not type="password": Firefox only offers to save
           logins from forms with a password-type field, and this is another
           site's password. .secret masks it with CSS instead. -->
      <input id="password" type="text" class="secret" autocomplete="off" spellcheck="false" autocapitalize="off"
             data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
      <div class="actions">
        <button type="submit" class="primary">Save login</button>
        <button type="button" id="delete" class="danger">Forget</button>
      </div>
    </form>

    <p id="status" class="status" role="status"></p>
  </main>

  <footer>
    <a href="#" id="manage">Manage all logins</a>
    <button type="button" id="lock" class="quiet" hidden>Lock</button>
  </footer>

  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
