<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <h1>Basic Auth</h1>
  <p id="private-warning" class="warning" hidden>
    Not allowed in private windows. Enable "Run in Private Windows" in about:addons.
  </p>
  <form id="form">
    <label>Host or pattern
      <span class="input-row">
        <input id="host" placeholder="*.example.com" required>
        <button type="button" id="use-current" title="Use the current tab's host">Current host</button>
      </span>
    </label>
    <label>Username <input id="username" autocomplete="off" required></label>
    <label>Password <input id="password" type="password" autocomplete="off"></label>
    <div class="row">
      <button type="submit">Save</button>
      <button type="button" id="delete">Forget</button>
    </div>
  </form>
  <p id="status"></p>
  <p><a href="#" id="manage">Manage all…</a></p>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
