# CI: unit tests on all three OSes, lint + build (the .xpi is kept as an
# artifact), and the headless Firefox Developer Edition end-to-end suite.
# The README's CI badge shows this workflow's status on the default branch.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Warnings fail CI too: AMO's validator runs the same linter.
      - run: npm run lint -- --warnings-as-errors
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: basic-auth-remember-xpi
          path: basic-auth-remember.xpi
          if-no-files-found: error

  e2e:
    name: End-to-end (Firefox Developer Edition)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - run: npm run e2e
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
